  <!-- CREATE ACCOUNT -->
  <div class="auth-card" id="create-view">
    <div class="auth-brand">
      <div class="stamp-badge">V</div>
      <div class="name">VASE</div>
      <div class="sub">Software Eng. Lab</div>
    </div>
    <h2>Create account</h2>

    <div id="create-error" class="login-error">
      <span>⚠</span><span id="create-error-text"></span>
    </div>

    <form id="create-form">
      <div class="field"><label>Student ID</label><input id="create-student-id" type="text" inputmode="numeric" maxlength="10" placeholder="10-digit student ID" required></div>
      <div class="field-row">
        <div class="field"><label>First Name</label><input id="create-first-name" type="text" placeholder="First name" required></div>
        <div class="field"><label>Last Name</label><input id="create-last-name" type="text" placeholder="Last name" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Faculty</label><input id="create-faculty" type="text" placeholder="Faculty" required></div>
        <div class="field"><label>Major</label><input id="create-major" type="text" placeholder="Major" required></div>
      </div>

      <div id="student-fields" style="display:none;">
        <div class="field">
          <label>Year</label>
          <select id="create-year">
            <option value="" disabled selected>Select your year</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
          </select>
        </div>
      </div>

      <div class="field"><label>Email</label><input id="create-email" type="email" placeholder="username@ku.th" required></div>
      <div class="field">
        <label>I am a</label>
        <select id="create-role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="phd_student">Ph.D. Student</option>
          <option value="undergrad_student">Undergraduate Student</option>
        </select>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input id="create-password" type="password" placeholder="Password" required>
          <button type="button" class="toggle-pw" data-toggle-pw="create-password">👁</button>
        </div>
      </div>
      <div class="field"><label>Confirm password</label><input id="create-confirm-password" type="password" placeholder="Confirm password" required></div>

      <button class="btn-primary" type="submit">Create account</button>
    </form>

    <div class="switch-form">already have an account? <a data-auth-view="login">Log in</a></div>
  </div>
