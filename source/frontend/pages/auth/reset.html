  <!-- reset password opened from the emailed link -->
  <div class="auth-card" id="reset-password-view">
    <div class="auth-brand">
      <div class="stamp-badge">V</div>
      <div class="name">VASE</div>
      <div class="sub">Software Eng. Lab</div>
    </div>
    <h2>Set a new password</h2>

    <div id="reset-password-error" class="login-error">
      <span>⚠</span><span id="reset-password-error-text"></span>
    </div>

    <form id="reset-password-form">
      <div class="field">
        <label>New password</label>
        <div class="input-wrap">
          <input id="reset-new-password" type="password" placeholder="At least 8 characters" required>
          <button type="button" class="toggle-pw" data-toggle-pw="reset-new-password">👁</button>
        </div>
      </div>
      <div class="field"><label>Confirm password</label><input id="reset-confirm-password" type="password" placeholder="Confirm password" required></div>
      <button class="btn-primary" type="submit">Update password</button>
    </form>

    <div class="switch-form">back to <a data-auth-view="login">Log in</a></div>
  </div>
