  <!-- LOG IN -->
  <div class="auth-card active" id="login-view">
    <div class="auth-brand">
      <div class="stamp-badge">V</div>
      <div class="name">VASE</div>
      <div class="sub">Software Eng. Lab</div>
    </div>
    <h2>Log in</h2>

    <div class="auth-right">
    <div id="login-error" class="login-error">
      <span>⚠</span><span id="login-error-text">Invalid email or password.</span>
    </div>
    <div id="login-notice" class="login-notice" role="status">
      <span>✓</span><span id="login-notice-text"></span>
    </div>
    <div id="login-resend-row" style="display:none;">Didn't get the email? <a id="login-resend" role="button" tabindex="0">Resend verification email</a></div>

    <form id="login-form">
      <div class="field"><label>Email</label><input id="login-email" type="email" placeholder="username@ku.th" required></div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input id="login-password" type="password" placeholder="Password" required>
          <button type="button" class="toggle-pw" data-toggle-pw="login-password">👁</button>
        </div>
      </div>
      <div class="row-between"><a data-auth-view="forgot-password" style="cursor:pointer;">Forgot password?</a></div>
      <button class="btn-primary" type="submit">Sign in</button>
    </form>

    <div class="login-divider">or continue with</div>
    <button class="btn-google" id="btn-google-login" type="button">
      <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    </div>

    <div class="switch-form">don't have account? <a data-auth-view="create">Create one</a></div>
  </div>
