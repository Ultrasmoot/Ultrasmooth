services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    env_file: backend/.env
    environment:
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    # The slim Python image has no curl, so the probe uses the standard library
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: mysql:8.0
    restart: unless-stopped
    # Keep NOW() / decided_at in the same timezone as the app server
    command: --default-time-zone=+07:00
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: vase_lab
      MYSQL_USER: vase_user
      MYSQL_PASSWORD: vase_pass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/seed.sql

volumes:
  db_data:
